name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Touch ID helper builds
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -O -swift-version 5 -o "$RUNNER_TEMP/touchid" src/touchid.swift
          code=0; "$RUNNER_TEMP/touchid" </dev/null || code=$?; test "$code" -eq 1
      - run: npm pack --dry-run
  # The tests need a Node that strips types; the published CLI (dist/) runs them under the oldest Node in "engines".
  old-node:
    strategy:
      fail-fast: false
      matrix:
        node: ["18.19", "20"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: echo "OLD_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env: { KEYSHROUD_TEST_NODE: "${{ env.OLD_NODE }}", KEYSHROUD_TEST_CLI: dist/cli.js }
      - run: '"$OLD_NODE" dist/cli.js --version'
  no-ai-coauthor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Commits credit people only: no Co-authored-by trailer for an AI.
      - run: |
          bad=$(git log --format='%h %(trailers:key=Co-authored-by,valueonly,separator=%x20)' HEAD | grep -iE 'claude|anthropic' || true)
          if [ -n "$bad" ]; then echo "AI co-author trailer in:"; echo "$bad"; exit 1; fi
