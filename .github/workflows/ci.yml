name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
  no-ai-coauthor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Commits credit people only: no Co-authored-by trailer for an AI.
      - run: |
          bad=$(git log --format='%h %(trailers:key=Co-authored-by,valueonly,separator=%x20)' HEAD | grep -iE 'claude|anthropic' || true)
          if [ -n "$bad" ]; then echo "AI co-author trailer in:"; echo "$bad"; exit 1; fi
