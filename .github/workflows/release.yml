name: Release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write   # npm provenance / trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with: { node-version: "24", registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish unless this version is already on npm
        run: |
          if npm view "keyshroud@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "already published"; else npm publish --provenance --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # omit once npm trusted publishing is configured
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
  registry:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
