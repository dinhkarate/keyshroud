name: Release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  actions: read     # the CI result of the tagged commit
  id-token: write   # npm provenance / trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      # A tag alone releases nothing: the commit must be on main, and CI (every OS and Node) green for it.
      - name: Verify the tagged commit is on main and passed CI
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(gh run list --workflow CI --commit "$GITHUB_SHA" --status success --json databaseId --jq length)" -ge 1
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: "24", registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish unless this version is already on npm
        run: |
          if npm view "keyshroud@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "already published"; else npm publish --provenance --access public; fi
      - name: Wait until the registry serves this version (the MCP Registry checks it)
        run: |
          url="https://registry.npmjs.org/keyshroud/$(node -p 'require("./package.json").version')"
          for i in $(seq 1 40); do curl -sf -o /dev/null "$url" && exit 0; sleep 15; done; exit 1
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
  registry:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
