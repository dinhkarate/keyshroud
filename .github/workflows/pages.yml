name: Site
# keyshroud.dev is served by Cloudflare Workers (wrangler.jsonc). GitHub Pages gets the
# same site/ as a standby: to fail back, point the apex A records at GitHub Pages again.
on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    # Needs the CLOUDFLARE_API_TOKEN repo secret; without it the steps are skipped and the deploy is by hand (`npx wrangler deploy`).
    env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CF_TOKEN != ''
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
