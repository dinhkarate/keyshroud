name: Site
# keyshroud.dev is served by Cloudflare Workers (wrangler.jsonc). GitHub Pages gets the
# same site/ as a standby: to fail back, point the apex A records at GitHub Pages again.
on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    # Skipped until the CLOUDFLARE_API_TOKEN repo secret exists; deploy by hand with `npx wrangler deploy`.
    env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
    steps:
      - uses: actions/checkout@v5
        if: env.CF_TOKEN != ''
      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
