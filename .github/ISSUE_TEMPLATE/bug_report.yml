name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste real secret values.** Security issues: use private vulnerability reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: { label: What happened, description: Commands you ran and what you expected }
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes: { label: keyshroud doctor output, description: Names and states only, render: text }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "keyshroud 0.7.3, bw 2026.8.0, macOS 15, Claude Code / pi / omp / MCP client" }
    validations: { required: true }
